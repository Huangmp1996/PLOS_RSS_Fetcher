name: PLOS RSS Fetcher & LLM Filter

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

jobs:
  run-rss-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch & LLM Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
        run: python main.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json processed_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed articles and history [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
