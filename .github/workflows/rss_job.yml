name: PLOS RSS Fetcher, LLM Filter & RSS Generator

on:
  schedule:
    # 每周一 UTC 00:00 (北京时间每周一 08:00) 自动触发
    - cron: '0 0 * * 1'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  run-rss-script:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖包
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 执行 Python 脚本（传入 DeepSeek API 配置）
      - name: Run Fetch, LLM & RSS Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
        run: python main.py

      # 5. 提交并推送生成的数据文件与 feed.xml
      - name: Commit and Push Updated Feed & Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 创建占位文件，防止首次运行未生成某些文件导致 git add 报错
          touch history.json processed_articles.json feed.xml
          
          git add history.json processed_articles.json feed.xml
          
          # 检查相关文件是否有实际变更，若有变更才执行 commit 和 push
          if git status --porcelain | grep -E 'history.json|processed_articles.json|feed.xml'; then
            git commit -m "Update RSS feed and processed articles [skip ci]"
            git push
          else
            echo "No changes detected in feed or data files. Skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
